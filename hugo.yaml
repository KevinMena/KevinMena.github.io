  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: Project Avatar
        content: |
          This project started as a personal challenge to create deep systems and create a game with a bigger scope. 
          The game is a *3D Top Down RPG* made in *Unity*.  
          **Still work in progress.**  

          **Features**: Combat System, Combo system for combat, Abilities system, 3D Controller, Stats system, IA working with Utility AI
        image: images/projects/gifs/combo-combat.gif
        # featured:
        #   name: Demo
        #   link: https://hugo-profile.netlify.app
        badges:
          - "Unity"
          - "C#"
        links:
          - icon: fab fa-github
            url: https://github.com/KevinMena/project-avatar
      
      - title: Tiny Graphics Odin
        content: |
          Custom mini graphics engine built from the ground up to master modern graphics pipelines, utilizing Odin for superior memory control and SDL3 for low-level hardware abstraction.
          This project is my way to try to elevate my knowledge about making games. I wanted to try and make a game engine to understand better how everything works under the hood and also took the oportunity to learn a new programming language
          in the process. 
        image: images/projects/img/model.png
        # featured:
        #   name: Demo
        #   link: https://django-converter.herokuapp.com
        badges:
          - "Odin"
          - "SDL3"
          - "Engines"
        links:
          - icon: fab fa-github
            url: https://github.com/KevinMena/tiny-graphics-odin

      - title: Recontru-Bot
        content: Game made for the Caracas Game Jam 2020. An art deco adventure of a robot that wants to repair the world and follow his dreams.
        image: images/projects/img/recontrubot.jpg
        featured:
          name: Try
          link: https://globalgamejam.org/2020/games/reconstru-bot-5
        badges:
          - "Unity"
          - "C#"
        links:
          - icon: fab fa-github
            url: https://github.com/KevinMena/cgj2020

      - title: Prince of Graecia
        content: Game made for the Caracas Game Jam 2021. The God Apollo has taken away Orion's powers, darkening the stars of his constellation. Now Orion has to defeat the servants of Apollo to return the light to his stars and regain his powers. (Not a bootleg)
        image: images/projects/img/prince.png
        featured:
          name: Try
          link: https://globalgamejam.org/2021/games/prince-graecia-1
        badges:
          - "Unity"
          - "C#"
        links:
          - icon: fab fa-github
            url: https://github.com/Nabos-Inc/BossRush/
      
      - title: Eumaclang
        content: General-purposed programming language developed in the courses _CI4721 - Programming Languages II_ and _CI4722 - Programming Languages III_ in the terms April-July 2021 and September-December 2021.
        # image: /images/projects/converter.jpg
        badges:
          - "C++"
          - "Flex"
          - "Bison"
        links:
          - icon: fab fa-github
            url: https://github.com/ArriagaAmin/maclang
      
      - title: Tac To Mips
        content: Translator from Three Address Code to MIPS Architecture (specifically to MARS).
        # image: /images/projects/converter.jpg
        badges:
          - "C++"
          - "MIPS"
        links:
          - icon: fab fa-github
            url: https://github.com/KevinMena/tac2mips
      
      - title: Backoffice
        content: Web application for the management of hours and tasks worked by human talent within a company.
        # image: /images/projects/converter.jpg
        badges:
          - "Django"
          - "Python"
          - "HTML"
          - "CSS"
        links:
          - icon: fab fa-github
            url: https://github.com/manuelguillegil/backoffice

