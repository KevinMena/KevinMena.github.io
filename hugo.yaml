    image: "/images/author/CVPhoto.jpg"
    content: "I'm a Computer Engineer and Game Programmer from Venezuela. Graduated from **Simón Bolívar University** in Computer Engineering. Practical programmer with a great passion for games since young age. I enjoy writing effective and well-organized code. I'm not afraid to work on new things because I see this as an oppotunity to grow."
