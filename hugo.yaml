              icon: images/logos/csharp-logo.png
            - name: "C++"
              icon: images/logos/cpp-logo.png
            - name: "Python"
              icon: images/logos/python-logo.png
            - name: "Java"
              icon: images/logos/java-logo.png
            - name: "Dart"
              icon: images/logos/dart-logo.png
        - title: "Extras"
          items:
            - name: "C"
              icon: images/logos/c-logo.png
            - name: "JavaScript"
              icon: images/logos/js-logo.png
            - name: "Rust"
              icon: images/logos/rust-logo.png
            - name: "Haskell"
              icon: images/logos/haskell-logo.png
